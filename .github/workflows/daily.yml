name: 每日600℃·d累计
on:
  schedule:
    - cron: "0 0 * * *"    # UTC 0:00 = 北京时间每天 08:00（7天/28天当天8点起提醒）
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TARGET: "600"   # 各项目坐标在 projects.json 中配置

jobs:
  accumulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 同步远端（防并发冲突）
        run: |
          git config user.name "600cd-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
      - name: 读取温度并累加
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python update.py
      - name: 提交数据
        run: |
          git config user.name "600cd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "无变化" || (git commit -m "数据更新 $(date -u +%F)" && git push)
