name: 每日试压到期提醒(16点)
on:
  schedule:
    - cron: "0 8 * * *"    # UTC 8:00 = 北京时间 16:00
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TARGET: "600"
  RUN_MODE: "milestone"

jobs:
  milestone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 同步远端（防并发冲突）
        run: |
          git config user.name "600cd-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
      - name: 计算并推送试压到期提醒
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python update.py
      - name: 提交数据
        run: |
          git config user.name "600cd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "无变化" || (git commit -m "试压提醒 $(date -u +%F)" && git push)
